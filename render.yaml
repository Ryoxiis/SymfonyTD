# Blueprint Render : décrit le site RyoPets et sa base de données.
# Sur render.com : New > Blueprint > choisir le dépôt GitHub. Render crée tout automatiquement.
services:
  - type: web
    name: ryopets
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: TRUSTED_PROXIES
        value: REMOTE_ADDR
      # Clé secrète de Symfony : Render en génère une automatiquement
      - key: APP_SECRET
        generateValue: true
      # Adresse de la base PostgreSQL créée ci-dessous
      - key: DATABASE_URL
        fromDatabase:
          name: ryopets-db
          property: connectionString

databases:
  - name: ryopets-db
    plan: free
    region: frankfurt
    databaseName: ryopets
    user: ryopets
    postgresMajorVersion: '17'
